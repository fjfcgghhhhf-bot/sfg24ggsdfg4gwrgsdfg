services:
  - type: web
    name: sfg24-upgrade
    runtime: node
    plan: free
    repo: https://github.com/fjfcgghhhhf-bot/sfg24ggsdfg4gwrgsdfg
    branch: main
    buildCommand: npm run build && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GOAL_CODE
        sync: false
